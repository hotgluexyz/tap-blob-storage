[tool.poetry]
name = "tap-blob-storage"
version = "1.1.0"
description = "`tap-blob-storage` is a Singer tap for Azure Blob Storage, built with the Hotglue Singer SDK for Singer Taps."
authors = ["Hotglue"]
keywords = [
    "ELT",
    "Azure Blob Storage",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.15,>=3.7.1"
azure-storage-blob = ">=12.19.0,<13"
hotglue-singer-sdk = ">=1.0.43"
hotglue-etl-exceptions = ">=0.1.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = "tap_blob_storage"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-blob-storage = "tap_blob_storage.tap:TapBlobStorage.cli"
