name: CI

on:
  pull_request:
    paths:
      - '**.py'
      - 'ruff.toml'
      - 'tox.ini'
      - 'pyproject.toml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install tox
        run: pip install tox

      - name: Lint
        run: tox -e ruff

      - name: Test
        run: tox -e pytest
